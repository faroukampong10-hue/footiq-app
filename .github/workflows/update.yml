name: Update FootIQ data

on:
  schedule:
    - cron: "30 7 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.json
        run: python update.py
      - name: Save data.json
        run: |
          git config user.name "footiq-bot"
          git config user.email "footiq-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Update data"
          git push
