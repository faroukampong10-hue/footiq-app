<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1210">
<title>FootIQ</title>
<style>
:root{--bg:#0b1210;--card:#131d19;--line:#22322b;--tx:#e8f1ec;--mu:#9bb0a5;--ac:#2ecc71;--am:#e6a23c;--gr:#8a958f;--bad:#e74c3c;--bl:#3b82f6;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f8f5;--card:#fff;--line:#d9e5de;--tx:#14201a;--mu:#53695d;--ac:#188a49;--am:#b36b00;--gr:#6b7872;--bad:#c0392b;--bl:#1d5fd1;color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f8f5;--card:#fff;--line:#d9e5de;--tx:#14201a;--mu:#53695d;--ac:#188a49;--am:#b36b00;--gr:#6b7872;--bad:#c0392b;--bl:#1d5fd1;color-scheme:light}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;padding-bottom:96px}
main{max-width:560px;margin:0 auto;padding:12px 16px}
h1{margin:0;font-size:24px;font-weight:800}h1 b{color:var(--ac)}
.s{color:var(--mu);font-size:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.h{display:flex;justify-content:space-between;align-items:baseline;margin-top:16px;font-weight:700}.h span{color:var(--ac);font-size:12px;font-weight:400}
.bd{display:inline-block;flex:none;border-radius:50%;background:var(--line);border:1px solid var(--line);text-align:center;font-weight:700}
.dot{display:inline-block;width:16px;height:16px;border-radius:50%;color:#fff;font:700 9px/16px system-ui;text-align:center;margin-left:2px}
.W{background:#27ae60}.D{background:#6f7b75}.L{background:#c0392b}
.bar{display:flex;gap:2px;border-radius:4px;overflow:hidden}.bar i{display:block}
.row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;color:inherit;font:inherit;width:100%;text-align:left}
.row:first-child{border-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips button{padding:8px 14px;border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--tx);font:600 12px system-ui}.chips button.on{background:var(--ac);color:#06210f;border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 3px;text-align:center}th{color:var(--mu);font-weight:600}td.t{text-align:left}tr+tr td{border-top:1px solid var(--line)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.note{border-left:3px solid #2d5a43;padding:6px 10px;color:var(--mu);font-size:12px;margin-top:10px}
nav{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;height:58px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:flex}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 10px system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:44px}nav button.on{color:var(--ac)}
</style>
</head>
<body>
<main id="v"></main>
<nav id="n" aria-label="Main"></nav>
<script>
let D=null,AS="";;
let CODE={"Arsenal":"ARS","Aston Villa":"AVL","Bournemouth":"BOU","Brentford":"BRE","Brighton":"BHA","Chelsea":"CHE","Coventry":"COV","Crystal Palace":"CRY","Everton":"EVE","Fulham":"FUL","Hull":"HUL","Ipswich":"IPS","Leeds":"LEE","Liverpool":"LIV","Man City":"MCI","Man United":"MUN","Newcastle":"NEW","Nott'm Forest":"NFO","Sunderland":"SUN","Tottenham":"TOT"};
const q=s=>String(s).replace(/'/g,"\u2019");
const S={tab:"home",view:"up",open:null,team:null,sim:null,docs:[],db:null,uid:null,msg:""};
let T={},TB=[];
let K="pl";
function switchLeague(k){K=k;D=LG[k];CODE=D.codes;build();S.open=null;S.team=null;S.sim=null;if(S.tab==="team"||S.tab==="sim")S.tab="table";render()}
function leagueChips(){return S.tab==="tracker"?"":'<div class="chips">'+Object.keys(LG).map(k=>'<button data-lg="'+k+'" class="'+(K===k?"on":"")+'">'+LG[k].name+"</button>").join("")+"</div>"}
function build(){T={};D.res.forEach(r=>{const[d,h,a,hg,ag]=r;for(const[t,gf,ga]of[[h,hg,ag],[a,ag,hg]]){const x=T[t]||(T[t]={t,P:0,W:0,D:0,L:0,GF:0,GA:0,Pts:0,f:[]});x.P++;x.GF+=gf;x.GA+=ga;const o=gf>ga?"W":gf===ga?"D":"L";x[o]++;x.Pts+=o==="W"?3:o==="D"?1:0;x.f.push(o)}});
TB=Object.values(T).sort((a,b)=>b.Pts-a.Pts||(b.GF-b.GA)-(a.GF-a.GA)||b.GF-a.GF);TB.forEach((x,i)=>x.pos=i+1);}
let LG={};
const bd=(t,s)=>'<span class="bd" style="width:'+s+'px;height:'+s+'px;font-size:'+Math.round(s/3+1)+'px;line-height:'+s+'px">'+(CODE[t]||t.slice(0,3).toUpperCase())+"</span>";
const dots=f=>f.slice(-5).map(c=>'<span class="dot '+c+'">'+c+"</span>").join("");
const bar=(h,d,a,hh)=>'<div class="bar" style="height:'+hh+'px"><i style="width:'+h+'%;background:var(--ac)"></i><i style="width:'+d+'%;background:var(--gr)"></i><i style="width:'+a+'%;background:var(--am)"></i></div>';
const card=x=>'<div class="card">'+x+"</div>";
const hd=(a,b)=>'<div class="h">'+a+"<span>"+(b||"")+"</span></div>";
const fd=(d,t)=>new Date(d+"T12:00:00").toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
const key=m=>m[0]+"-"+m[1]+"-"+CODE[m[2]];
function mkt(m){if(m[9]==null)return"";const f=v=>Math.round(v)+"%",dd=(a,b)=>{const x=Math.round(a)-Math.round(b);return '<td style="color:'+(x>0?"var(--ac)":x<0?"var(--bad)":"var(--mu)")+'">'+(x>0?"+":x<0?"\u2212":"")+Math.abs(x)+"</td>"};
 return '<table style="margin-top:8px"><thead><tr><th class="t"></th><th>Home</th><th>Draw</th><th>Away</th></tr></thead><tbody><tr><td class="t">Model</td><td>'+f(m[4])+"</td><td>"+f(m[5])+"</td><td>"+f(m[6])+'</td></tr><tr><td class="t">Market</td><td>'+f(m[9])+"</td><td>"+f(m[10])+"</td><td>"+f(m[11])+'</td></tr><tr><td class="t">Gap</td>'+dd(m[4],m[9])+dd(m[5],m[10])+dd(m[6],m[11])+"</tr></tbody></table>"}
function detail(m){const h=T[m[2]],a=T[m[3]];
 return '<div style="padding:4px 0 10px">'+bar(m[4],m[5],m[6],12)
 +'<div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin-top:5px"><span style="color:var(--ac)">'+Math.round(m[4])+'%</span><span style="color:var(--mu)">'+Math.round(m[5])+'%</span><span style="color:var(--am)">'+Math.round(m[6])+'%</span></div>'
 +'<div class="s" style="display:flex;justify-content:space-between"><span>'+m[2]+"</span><span>Draw</span><span>"+m[3]+"</span></div>"
 +'<div class="s" style="margin-top:8px">Expected goals '+m[7].toFixed(1)+" \u2013 "+m[8].toFixed(1)+"</div>"
 +'<div class="kv" style="margin-top:8px"><span>'+dots(h.f)+'</span><span class="s">Last 5</span><span>'+dots(a.f)+"</span></div>"
 +'<div class="kv"><b>'+h.pos+"th \u00b7 "+h.Pts+' pts</b><span class="s">Position</span><b>'+a.pos+"th \u00b7 "+a.Pts+" pts</b></div>"
 +mkt(m)+'<button data-sim="'+D.up.indexOf(m)+'" style="width:100%;margin-top:10px;padding:12px;border-radius:12px;border:1px solid var(--ac);background:none;color:var(--ac);font:700 13px system-ui;min-height:44px">Try a scenario \u203a</button><div class="note">'+(m[9]!=null?"Market means the bookmaker average with the margin removed. ":"Bookmaker odds arrive when the fixtures file updates. ")+"The model uses results and shots only, not injuries or lineups.</div></div>"}
function mrow(m){const o=S.open===key(m);
 return '<div><button class="row" data-o="'+key(m)+'" aria-expanded="'+o+'"><span class="s" style="width:38px">'+m[1]+'</span><span style="flex:1;min-width:0"><span style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px">'+bd(m[2],22)+m[2]+'</span><span style="display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;margin-top:4px">'+bd(m[3],22)+m[3]+'</span></span><span style="width:92px"><span class="s" style="display:flex;justify-content:space-between;margin-bottom:3px"><span>'+Math.round(m[4])+"</span><span>"+Math.round(m[5])+"</span><span>"+Math.round(m[6])+"</span></span>"+bar(m[4],m[5],m[6],6)+"</span></button>"+(o?detail(m):"")+"</div>"}
function gapCard(){const g=D.up.filter(m=>m[9]!=null).map(m=>{const x=[[m[2]+" win",m[4],m[9]],["Draw",m[5],m[10]],[m[3]+" win",m[6],m[11]]].map(y=>({o:y[0],mod:y[1],mk:y[2],diff:y[1]-y[2]})).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff))[0];x.m=m;x.pr=[m[2],m[3]].filter(t=>(D.promoted||[]).indexOf(t)>=0);return x}).sort((a,b)=>Math.abs(b.diff)-Math.abs(a.diff)).slice(0,3);
 if(!g.length)return"";return hd("Biggest model vs market gaps")+g.map(x=>card("<b>"+x.m[2]+" v "+x.m[3]+'</b><div style="margin:4px 0">'+x.o+": model "+Math.round(x.mod)+"%, market "+Math.round(x.mk)+'% <b style="color:'+(x.diff>0?"var(--ac)":"var(--bad)")+'">('+(x.diff>0?"+":"\u2212")+Math.abs(Math.round(x.diff))+' pts)</b></div><div class="s">'+(x.pr.length?x.pr.join(" and ")+(x.pr.length>1?" are":" is")+" newly promoted, so the model has little to go on. The market knows more.":"A big gap usually means the market knows something the model cannot see, such as injuries or lineups.")+"</div>")).join("")}
function homeNoUp(){const r=D.rec,tr=Object.entries(D.sim).sort((x,y)=>y[1][0]-x[1][0]).slice(0,3);
 return card('<div style="font-weight:700">Next round not listed yet</div><div class="s" style="margin-top:6px">The next fixtures appear here when football-data lists them, usually a day or two before the matches.</div>')
 +'<div style="display:flex;gap:8px;margin-top:12px">'+[[r.n,"Played"],[r.ml.toFixed(3),"Model log loss"],[r.kl.toFixed(3),"Market log loss"]].map(x=>'<div class="card" style="flex:1;margin:0;text-align:center;padding:9px"><div style="font-weight:800;font-size:17px">'+x[0]+'</div><div class="s" style="font-size:10px">'+x[1]+"</div></div>").join("")+"</div>"
 +hd("Title race","Season")+card(tr.map(x=>'<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px"><div style="width:84px">'+x[0]+'</div><div style="flex:1;height:8px;border-radius:4px;background:var(--line)"><div style="width:'+x[1][0]+'%;height:8px;border-radius:4px;background:var(--ac)"></div></div><b style="width:42px;text-align:right">'+x[1][0]+"%</b></div>").join(""))}
function home(){if(!D.up.length)return homeNoUp();const f=D.up[0],h=T[f[2]],a=T[f[3]],r=D.rec;
 const tr=Object.entries(D.sim).sort((x,y)=>y[1][0]-x[1][0]).slice(0,3);
 return card('<div class="s" style="color:var(--ac);letter-spacing:.06em">FEATURED \u00b7 '+fd(f[0]).split(" ")[0].toUpperCase().slice(0,3)+" "+f[1]+'</div><div style="display:flex;justify-content:space-around;align-items:center;margin:12px 0 10px"><div style="text-align:center">'+bd(f[2],44)+'<div style="font-weight:700;margin-top:6px">'+f[2]+'</div><div style="margin-top:4px">'+dots(h.f)+'</div></div><span class="s">vs</span><div style="text-align:center">'+bd(f[3],44)+'<div style="font-weight:700;margin-top:6px">'+f[3]+'</div><div style="margin-top:4px">'+dots(a.f)+"</div></div></div>"+bar(f[4],f[5],f[6],10)+'<div style="display:flex;justify-content:space-between;font-weight:700;font-size:12px;margin-top:5px"><span style="color:var(--ac)">'+Math.round(f[4])+'%</span><span class="s">'+Math.round(f[5])+'%</span><span style="color:var(--am)">'+Math.round(f[6])+"%</span></div>")
 +'<div style="display:flex;gap:8px;margin-top:12px">'+[[r.n,"Played"],[r.ml.toFixed(3),"Model log loss"],[r.kl.toFixed(3),"Market log loss"]].map(x=>'<div class="card" style="flex:1;margin:0;text-align:center;padding:9px"><div style="font-weight:800;font-size:17px">'+x[0]+'</div><div class="s" style="font-size:10px">'+x[1]+"</div></div>").join("")+"</div>"
 +hd("Next matches","<span data-t='matches' style='cursor:pointer'>See all</span>")+card(D.up.slice(1,4).map(mrow).join(""))
 +gapCard()+hd("Title race","Season")+card(tr.map(x=>'<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:6px"><div style="width:84px">'+x[0]+'</div><div style="flex:1;height:8px;border-radius:4px;background:var(--line)"><div style="width:'+x[1][0]+'%;height:8px;border-radius:4px;background:var(--ac)"></div></div><b style="width:42px;text-align:right">'+x[1][0]+"%</b></div>").join(""))
 +'<div class="note">Lower log loss is better. The market is still slightly ahead of the model. Simulations and probabilities use results and shots only.</div>'}
function matches(){let h='<div class="chips"><button data-v="up" class="'+(S.view==="up"?"on":"")+'">Upcoming</button><button data-v="res" class="'+(S.view==="res"?"on":"")+'">Results</button></div>';
 if(S.view==="up"&&!D.up.length)h+='<div class="note">Next round not listed yet. Fixtures appear when football-data lists them, usually a day or two before the matches.</div>';if(S.view==="up"){let last="";D.up.forEach(m=>{if(m[0]!==last){last=m[0];h+=hd(fd(m[0]),D.up.filter(x=>x[0]===m[0]).length+" matches")+'<div class="card" style="padding:2px 12px">'+D.up.filter(x=>x[0]===m[0]).map(mrow).join("")+"</div>"}})}
 else{const R=D.res.slice(-20).reverse();let last="";R.forEach(r=>{if(r[0]!==last){last=r[0];h+=hd(fd(r[0]))+'<div class="card" style="padding:2px 12px">'+R.filter(x=>x[0]===r[0]).map(x=>'<div class="row" style="cursor:default"><span style="flex:1;font-size:13px;font-weight:600">'+x[1]+'</span><b style="font-size:15px">'+x[3]+" \u2013 "+x[4]+'</b><span style="flex:1;text-align:right;font-size:13px;font-weight:600">'+x[2]+"</span></div>").join("")+"</div>"}})}
 return h}
function table(){return '<div class="card" style="padding:6px 8px;overflow-x:auto"><table><thead><tr><th>#</th><th class="t">Team</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>'+TB.map(x=>'<tr data-tm="'+x.t.replace(/"/g,"")+'" style="cursor:pointer"><td'+(x.pos<=4?' style="box-shadow:inset 3px 0 var(--ac)"':x.pos>TB.length-(D.nrel||3)?' style="box-shadow:inset 3px 0 var(--bad)"':"")+">"+x.pos+'</td><td class="t" style="white-space:normal"><span style="display:flex;align-items:center;gap:6px">'+bd(x.t,20)+x.t+"</span></td><td>"+x.W+"</td><td>"+x.D+"</td><td>"+x.L+"</td><td>"+(x.GF-x.GA)+"</td><td><b>"+x.Pts+"</b></td><td style='white-space:nowrap'>"+dots(x.f)+"</td></tr>").join("")+'</tbody></table></div><div class="s" style="margin-top:6px">Green edge: top 4. Red edge: bottom '+(D.nrel||3)+'. After '+D.gp+' games each.</div>'}
function season(){const L=(t,k,c,n)=>hd(t)+card(Object.entries(D.sim).sort((x,y)=>y[1][k]-x[1][k]).slice(0,n).map(x=>'<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:7px"><div style="width:96px">'+x[0]+'</div><div style="flex:1;height:8px;border-radius:4px;background:var(--line)"><div style="width:'+x[1][k]+'%;height:8px;border-radius:4px;background:'+c+'"></div></div><b style="width:44px;text-align:right">'+x[1][k]+"%</b></div>").join(""));
 return L("Title",0,"var(--ac)",4)+L("Top 4",1,"var(--bl)",5)+L("Relegation",2,"var(--bad)",5)+'<div class="note">4,000 simulated seasons from the model. Ratings stay fixed after '+D.gp+' games, so treat these as rough, not as forecasts to bet on.</div>'+(D.sn?'<div class="note">'+D.sn+"</div>":"")}

function teamPage(){const x=T[S.team],ts=D.ts[S.team],si=D.sim[S.team],g=x.P||1;
 const ms=D.res.filter(r=>r[1]===S.team||r[2]===S.team).reverse();
 const sp=(h)=>{let w=0,d=0,l=0,gf=0,ga=0;D.res.forEach(r=>{if((h&&r[1]===S.team)||(!h&&r[2]===S.team)){const a=h?r[3]:r[4],b=h?r[4]:r[3];gf+=a;ga+=b;a>b?w++:a===b?d++:l++}});return[w,d,l,gf,ga]};
 const hm=sp(1),aw=sp(0),bar2=(l,v,c)=>'<div style="display:flex;align-items:center;gap:8px;font-size:12px;margin-top:7px"><div style="width:62px">'+l+'</div><div style="flex:1;height:8px;border-radius:4px;background:var(--line)"><div style="width:'+Math.min(v,150)/1.5+'%;height:8px;border-radius:4px;background:'+c+'"></div></div><b style="width:34px;text-align:right">'+v+"</b></div>";
 return '<button data-t="table" style="background:none;border:0;color:var(--ac);font:600 13px system-ui;padding:8px 0;min-height:44px">\u2039 Table</button>'
 +card('<div style="display:flex;align-items:center;gap:12px">'+bd(S.team,48)+'<div style="flex:1"><div style="font-size:18px;font-weight:800">'+S.team+'</div><div class="s">'+x.pos+'th \u00b7 '+x.Pts+' pts \u00b7 GD '+(x.GF-x.GA)+'</div></div></div><div style="margin-top:10px">'+dots(x.f)+'</div>')
 +hd("Model rating")+card(bar2("Attack",ts[3],"var(--ac)")+bar2("Defence",ts[4],"var(--bl)")+'<div class="s" style="margin-top:8px">100 is league average. Built from goals and shots in earlier matches plus last season\u2019s points.</div>')
 +hd("Per game")+'<div style="display:flex;gap:8px;margin-top:10px">'+[[(x.GF/g).toFixed(1),"Goals for"],[(x.GA/g).toFixed(1),"Goals against"],[ts[0],"Shots"],[ts[1],"On target"]].map(a=>'<div class="card" style="flex:1;margin:0;text-align:center;padding:9px"><div style="font-weight:800;font-size:16px">'+a[0]+'</div><div class="s" style="font-size:10px">'+a[1]+"</div></div>").join("")+"</div>"
 +hd("Home and away")+card('<table><thead><tr><th class="t"></th><th>W</th><th>D</th><th>L</th><th>GF\u2013GA</th></tr></thead><tbody><tr><td class="t">Home</td><td>'+hm[0]+"</td><td>"+hm[1]+"</td><td>"+hm[2]+"</td><td>"+hm[3]+"\u2013"+hm[4]+'</td></tr><tr><td class="t">Away</td><td>'+aw[0]+"</td><td>"+aw[1]+"</td><td>"+aw[2]+"</td><td>"+aw[3]+"\u2013"+aw[4]+"</td></tr></tbody></table>")
 +hd("Season simulation")+card('<div style="display:flex;justify-content:space-around;text-align:center"><div><b style="font-size:17px">'+si[0]+'%</b><div class="s">Title</div></div><div><b style="font-size:17px">'+si[1]+'%</b><div class="s">Top 4</div></div><div><b style="font-size:17px">'+si[2]+'%</b><div class="s">Relegation</div></div></div><div class="s" style="text-align:center;margin-top:8px">Projected '+si[3]+" points</div>")
 +hd("Results")+card(ms.map(r=>{const hm=r[1]===S.team,o=hm?r[3]:r[4],p=hm?r[4]:r[3],c=o>p?"W":o===p?"D":"L";return '<div class="kv" style="align-items:center"><span class="s" style="width:70px">'+r[0].slice(5)+'</span><span style="flex:1">'+(hm?"v ":"at ")+(hm?r[2]:r[1])+'</span><b>'+r[3]+"\u2013"+r[4]+'</b><span class="dot '+c+'" style="margin-left:8px">'+c+"</span></div>"}).join(""))}
function modelPage(){const R=D.mr,n=R.length,ix={H:0,D:1,A:2};
 let a=[0,0],ll=[0,0],br=[0,0],cl=[[],[]],bins={};
 R.forEach((r,i)=>{[0,1].forEach(k=>{const p=[r[3*k]/100,r[3*k+1]/100,r[3*k+2]/100],o=ix[r[6]];
  if(p.indexOf(Math.max(...p))===o)a[k]++;ll[k]+=-Math.log(p[o]);br[k]+=p.reduce((s,v,j)=>s+Math.pow(v-(j===o?1:0),2),0);cl[k].push(ll[k]/(i+1));
  if(k===0)p.forEach((v,j)=>{const b=Math.min(Math.floor(v*10),9);const z=bins[b]||(bins[b]={n:0,s:0,h:0});z.n++;z.s+=v;if(j===o)z.h++})})});
