<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e1512">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>FootIQ</title>
<style>
:root{--bg:#0e1512;--card:#17211c;--text:#e8f1ec;--muted:#8fa699;--accent:#2ecc71;--bad:#e74c3c;--warn:#f1c40f;--line:#24332b;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f8f5;--card:#fff;--text:#14201a;--muted:#5d7468;--accent:#1e9e55;--bad:#c0392b;--warn:#b7950b;--line:#dbe6df;color-scheme:light}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 4px}
h1{margin:0;font-size:22px}h1 span{color:var(--accent)}
h3{margin:14px 0 2px}
.sub{color:var(--muted);font-size:12px;margin:6px 0}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 1px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:12px}
nav button.on{background:var(--accent);color:#06210f;border-color:var(--accent);font-weight:700}
main{padding:4px 12px 20px}
footer{padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.wrap{overflow-x:auto;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 4px;text-align:center;white-space:nowrap}
td.tn{white-space:normal;min-width:84px}
th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.tn{text-align:left}
tr.team{cursor:pointer}
tr.top td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.bot td:first-child{box-shadow:inset 3px 0 var(--bad)}
tbody tr+tr td{border-top:1px solid var(--line)}
.f{display:inline-block;width:15px;height:15px;margin-left:1px;border-radius:50%;font:700 9px/15px system-ui;color:#fff;text-align:center}
.f.W{background:#27ae60}.f.D{background:#8a8f94}.f.L{background:#c0392b}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.c b{display:block;font-size:20px}.c span{color:var(--muted);font-size:11px}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.m{display:flex;justify-content:space-between;gap:8px;align-items:center}
.m.tap{cursor:pointer}
.d{color:var(--muted);font-size:11px}
.sc{font-weight:700}
.ok{color:var(--accent);font-weight:700;font-size:20px}.no{color:var(--bad);font-weight:700;font-size:20px}
button.more{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.note{border-left:3px solid var(--accent);padding:6px 10px;color:var(--muted);font-size:13px;margin:10px 0}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:8px 0 4px;font-size:11px;font-weight:700;color:#06210f}
.bar div{display:flex;align-items:center;justify-content:center;min-width:0}
.bH{background:var(--accent)}.bD{background:#9aa5a0}.bA{background:#e6a23c}
.bar .hit{outline:2px solid var(--text);outline-offset:-2px}
.row{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);font-size:13px}
.row:first-of-type{border-top:0}
.row span:first-child{color:var(--muted)}
a{color:var(--accent)}
</style>
</head>
<body>
<header><h1>Foot<span>IQ</span> ⚽</h1><div class="sub">Premier League 2015/16</div></header>
<nav id="nav"></nav>
<main id="view"><p class="sub">Loading…</p></main>
<footer><p class="sub">Data: <a href="https://github.com/statsbomb/open-data">StatsBomb open data</a>, 2015/16 Premier League. Predictions are backtested using only earlier results.</p></footer>
<script>
const API="https://releufvadodqjufvqboi.supabase.co/rest/v1/";
const KEY="sb_publishable_kFt_dXaAGUm1ksFsNnAWTA_bqE0E8dL";
const S={tab:"table",table:[],preds:[],mq:[],cmp:[],px:{},mk:{},cl:{},msel:"cur",live:[],lt:null,team:"",res:"",open:null,shown:50};
const TABS=[["table","Standings"],["next","Next"],["preds","Matches"],["team","Teams"],["model","Model"]];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>{v=Number(v);return isNaN(v)?0:v};
const pc=v=>{v=num(v);return v>0&&v<=1?v*100:v};
const view=document.getElementById("view"),nav=document.getElementById("nav");
async function get(path){
  const r=await fetch(API+path,{headers:{apikey:KEY}});
  if(!r.ok)throw new Error("Request failed ("+r.status+")");
  return r.json();
}
const dots=f=>(f||"").split("").map(c=>'<i class="f '+esc(c)+'">'+esc(c)+"</i>").join("");
const tag=(t,a)=>'<div class="'+t+'">'+a+"</div>";
const card=(a,b)=>'<div class="c"><b>'+a+"</b><span>"+b+"</span></div>";
function opts(list,cur,all){return '<option value="">'+all+"</option>"+list.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===cur?" selected":"")+">"+esc(x[1])+"</option>").join("")}
function pct(p){const o=p.predicted_outcome;return Math.round(pc(o==="Home"?p.home_probability:o==="Draw"?p.draw_probability:p.away_probability))}

function tableView(){
  const rows=S.table.map(t=>'<tr class="team '+(t.position<=4?"top":t.position>=18?"bot":"")+'" data-team="'+esc(t.team_name)+'"><td>'+t.position+'</td><td class="tn">'+esc(t.team_name)+"</td><td>"+t.wins+"</td><td>"+t.draws+"</td><td>"+t.losses+"</td><td>"+t.goal_difference+"</td><td><b>"+t.points+"</b></td><td>"+dots(t.last_5_form)+"</td></tr>").join("");
  return '<div class="card wrap"><table><thead><tr><th>#</th><th class="tn">Team</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Form</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="sub">Tap a team for its detail page. Green edge: top 4. Red edge: bottom 3.</div>';
}

function cmpRows(p){
  const x=S.px[p.match_id],k=S.mk[p.match_id];
  if(!x&&!k)return "";
  const line=(l,a,b,c)=>"<tr><td class=\"tn\">"+l+"</td><td>"+Math.round(pc(a))+"%</td><td>"+Math.round(pc(b))+"%</td><td>"+Math.round(pc(c))+"%</td></tr>";
  return '<div class="wrap" style="margin-top:8px"><table><thead><tr><th class="tn">Who says</th><th>Home</th><th>Draw</th><th>Away</th></tr></thead><tbody>'
   +line("Current model",p.home_probability,p.draw_probability,p.away_probability)
   +(x?line("xG + prior",x.home_probability,x.draw_probability,x.away_probability):"")
   +(k?line("Market",k.market_home,k.market_draw,k.market_away):"")
   +"</tbody></table></div>";
}
function detail(p){
  const h=pc(p.home_probability),d=pc(p.draw_probability),a=pc(p.away_probability);
  const hit=k=>p.predicted_outcome===k?" hit":"";
  const done=p.actual_outcome!=null&&p.home_score!=null;
  return '<div style="margin-top:10px">'
   +'<div class="bar"><div class="bH'+hit("Home")+'" style="width:'+h+'%">'+Math.round(h)+'%</div><div class="bD'+hit("Draw")+'" style="width:'+d+'%">'+Math.round(d)+'%</div><div class="bA'+hit("Away")+'" style="width:'+a+'%">'+Math.round(a)+'%</div></div>'
   +'<div class="d" style="display:flex;justify-content:space-between"><span>Home win</span><span>Draw</span><span>Away win</span></div>'
   +'<div style="margin-top:8px">'
   +'<div class="row"><span>Model pick</span><span>'+esc(p.predicted_outcome)+" ("+pct(p)+"%)</span></div>"
   +'<div class="row"><span>Actual result</span><span>'+(done?esc(p.actual_outcome)+" "+p.home_score+"-"+p.away_score:"Not played")+"</span></div>"
   +'<div class="row"><span>Confidence</span><span>'+Math.round(pc(p.confidence_score))+"%</span></div>"
   +'<div class="row"><span>Model version</span><span>'+esc(p.model_version)+"</span></div>"
   +cmpRows(p)
   +'<div class="row"><span><a href="#" data-team="'+esc(p.home_team)+'">'+esc(p.home_team)+'</a></span><span><a href="#" data-team="'+esc(p.away_team)+'">'+esc(p.away_team)+"</a></span></div>"
   +"</div></div>";
}

function predsView(){
  const P=S.preds,ok=P.filter(p=>p.prediction_correct).length;
  const teams=[...new Set(P.flatMap(p=>[p.home_team,p.away_team]))].sort();
  const f=P.filter(p=>(!S.team||p.home_team===S.team||p.away_team===S.team)&&(!S.res||(S.res==="ok")===!!p.prediction_correct));
  const rows=f.slice(0,S.shown).map(p=>{
    const open=S.open===p.match_id;
    return '<div class="card"><div class="m tap" data-open="'+p.match_id+'"><div><div class="d">'+esc(p.match_date)+"</div><div>"+esc(p.home_team)+' <span class="sc">'+esc(p.home_score)+"-"+esc(p.away_score)+"</span> "+esc(p.away_team)+'</div><div class="d">Predicted '+esc(p.predicted_outcome)+" ("+pct(p)+'%) · actual '+esc(p.actual_outcome)+'</div></div><div class="'+(p.prediction_correct?"ok":"no")+'">'+(p.prediction_correct?"✓":"✗")+"</div></div>"+(open?detail(p):"")+"</div>";
  }).join("");
  return '<div class="note">Historical backtest: predictions for matches already played, made using only earlier results. Tap a match for the full breakdown.</div>'
   +'<div class="cards">'+card(P.length,"Matches")+card(ok,"Correct")+card((P.length?ok/P.length*100:0).toFixed(1)+"%","Accuracy")+"</div>"
   +'<div class="filters"><select id="fteam">'+opts(teams.map(t=>[t,t]),S.team,"All teams")+'</select><select id="fres">'+opts([["ok","Correct"],["miss","Wrong"]],S.res,"All results")+"</select></div>"
   +'<div class="sub">Showing '+Math.min(S.shown,f.length)+" of "+f.length+" matches (newest first)</div>"+rows
   +(f.length>S.shown?'<button class="more" id="more">Show more</button>':"");
}

function teamView(){
  const names=S.table.map(t=>t.team_name).sort();
  if(!S.team)S.team=names[0]||"";
  const t=S.table.find(x=>x.team_name===S.team);
  const sel='<select id="fteam2">'+opts(names.map(n=>[n,n]),S.team,"Choose a team").replace('<option value="">Choose a team</option>',"")+"</select>";
  if(!t)return sel;
  const mine=S.preds.filter(p=>p.home_team===S.team||p.away_team===S.team);
  const ok=mine.filter(p=>p.prediction_correct).length;
  let pw=0,aw=0;
  mine.forEach(p=>{const home=p.home_team===S.team;pw+=pc(home?p.home_probability:p.away_probability);if(p.actual_outcome===(home?"Home":"Away"))aw++});
  const n=mine.length||1,predWin=pw/n,actWin=aw/n*100,gap=predWin-actWin;
  const verdict=!mine.length?"No predictions yet.":Math.abs(gap)<5?"The model rates this team about right.":gap>0?"The model overrates this team: it expects more wins than it gets.":"The model underrates this team: it wins more than expected.";
  const recent=mine.slice(0,5).map(p=>'<div class="row"><span>'+esc(p.match_date)+" "+esc(p.home_team)+" "+esc(p.home_score)+"-"+esc(p.away_score)+" "+esc(p.away_team)+'</span><span class="'+(p.prediction_correct?"ok":"no")+'" style="font-size:15px">'+(p.prediction_correct?"✓":"✗")+"</span></div>").join("");
  const split=(l,p,w,d,lo,gf,ga,pts)=>"<tr><td class=\"tn\">"+l+"</td><td>"+p+"</td><td>"+w+"</td><td>"+d+"</td><td>"+lo+"</td><td>"+gf+"-"+ga+"</td><td><b>"+pts+"</b></td></tr>";
  return sel
   +'<div class="cards">'+card("#"+t.position,"Position")+card(t.points,"Points")+card(t.goal_difference,"Goal diff")+"</div>"
   +'<div class="card"><div class="d">Last 5</div><div style="margin-top:4px">'+dots(t.last_5_form)+"</div></div>"
   +'<div class="card wrap"><table><thead><tr><th class="tn"></th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF-GA</th><th>Pts</th></tr></thead><tbody>'
   +split("Home",t.home_played,t.home_wins,t.home_draws,t.home_losses,t.home_goals_for,t.home_goals_against,t.home_points)
   +split("Away",t.away_played,t.away_wins,t.away_draws,t.away_losses,t.away_goals_for,t.away_goals_against,t.away_points)
   +"</tbody></table></div>"
   +"<h3>Model on this team</h3>"
   +'<div class="cards">'+card(mine.length?(ok/mine.length*100).toFixed(0)+"%":"–","Accuracy")+card(predWin.toFixed(0)+"%","Expected win rate")+card(actWin.toFixed(0)+"%","Actual win rate")+"</div>"
   +'<div class="note">'+esc(verdict)+"</div>"
   +'<div class="card"><div class="d">Latest matches</div>'+recent+"</div>";
}

const MODELS=[["cur","Current model"],["cl","Clean xG model"],["px","xG + last-season prior"]];
function stats(sel){
  const src=p=>sel==="px"?S.px[p.match_id]:sel==="cl"?S.cl[p.match_id]:p;
  let n=0,ok=0,br=0,ll=0;const bins={};
  S.preds.forEach(p=>{
    const q=src(p);if(!q||!p.actual_outcome)return;
    const pr={Home:pc(q.home_probability)/100,Draw:pc(q.draw_probability)/100,Away:pc(q.away_probability)/100},res=p.actual_outcome;
    n++;
    const pick=pr.Home>=pr.Draw&&pr.Home>=pr.Away?"Home":pr.Away>=pr.Draw?"Away":"Draw";
    if(pick===res)ok++;
    br+=["Home","Draw","Away"].reduce((t,k)=>t+Math.pow(pr[k]-(k===res?1:0),2),0);
    ll+=-Math.log(Math.max(pr[res]||0,1e-12));
    ["Home","Draw","Away"].forEach(k=>{
      const b=Math.min(Math.floor(pr[k]*10),9),key=k+"|"+b;
      const o=bins[key]||(bins[key]={k:k,b:b,n:0,s:0,h:0});
      o.n++;o.s+=pr[k];if(k===res)o.h++;
    });
  });
  return {n:n,acc:n?ok/n*100:0,br:n?br/n:0,ll:n?ll/n:0,bins:bins};
}
function modelView(){
  if(!S.preds.length)return '<div class="note">No model data yet.</div>';
  const st=stats(S.msel),P=S.preds,nn=P.length||1,base=(P.filter(p=>p.actual_outcome==="Home").length/nn*100).toFixed(1);
  const order={Home:0,Draw:1,Away:2};
  const cal=Object.values(st.bins).sort((a,b)=>order[a.k]-order[b.k]||a.b-b.b);
  const rows=cal.map(r=>'<tr'+(r.n<20?' style="opacity:.45"':"")+'><td class="tn">'+r.k+"</td><td>"+(r.b*10)+"-"+(r.b*10+10)+"%</td><td>"+(r.s/r.n*100).toFixed(0)+"%</td><td>"+(r.h/r.n*100).toFixed(0)+"%</td><td>"+r.n+"</td></tr>").join("");
  const sel='<select id="fmodel">'+MODELS.map(m=>'<option value="'+m[0]+'"'+(m[0]===S.msel?" selected":"")+">"+m[1]+"</option>").join("")+"</select>";
  return '<div class="note"><b>2015/16 historical backtest</b>. Every model here is scored on matches already played, using only earlier results.</div>'
   +sel
   +'<div class="cards">'+card(st.acc.toFixed(1)+"%","Accuracy")+card(st.br.toFixed(3),"Brier")+card(st.ll.toFixed(3),"Log loss")+"</div>"
   +'<div class="card">Always picking a home win would be right <b>'+base+"%</b> of the time. Brier score and log loss measure the probabilities, not just the pick: lower is better.</div>"
   +"<h3>Models vs market</h3><div class=\"sub\">Sorted by log loss, lower is better. The market rows are the benchmark.</div>"
   +'<div class="card wrap"><table><thead><tr><th class="tn">Model</th><th>Acc</th><th>Brier</th><th>Log loss</th></tr></thead><tbody>'+S.cmp.slice().sort((a,b)=>num(a.log_loss)-num(b.log_loss)).map(r=>'<tr><td class="tn">'+esc(r.model)+"</td><td>"+num(r.accuracy_pct).toFixed(1)+"%</td><td>"+num(r.brier_score).toFixed(3)+"</td><td>"+num(r.log_loss).toFixed(3)+"</td></tr>").join("")+"</tbody></table></div>"
   +'<div class="note"><b>How to read this.</b> The market is the real benchmark. "xG + last-season prior" starts each team from its 2014/15 points, then updates from xG in earlier 2015/16 matches only. On this season it nearly matches the market, but its setting was tuned on this same season and 2015/16 was an unusually unpredictable year, so that closeness flatters it.<br><br><b>Tested on new seasons.</b> A goals-only version with the same idea, settings frozen on 2015/16, improved 2016/17 and 2017/18 (log loss 0.949 and 0.964, down from 0.964 and 0.987 without the prior). The market still scored better (0.907 and 0.941), so treat the model as decent but not market-level.</div>'
   +"<h3>Calibration: "+esc((MODELS.find(m=>m[0]===S.msel)||[0,""])[1])+"</h3><div class=\"sub\">When the model said X%, how often did it happen? Faded rows have under 20 matches, so ignore them.</div>"
   +'<div class="card wrap"><table><thead><tr><th class="tn">Outcome</th><th>Bin</th><th>Said</th><th>Saw</th><th>N</th></tr></thead><tbody>'+rows+"</tbody></table></div>";
}

function lbar(h,d,a){
  return '<div class="bar"><div class="bH" style="width:'+h+'%">'+Math.round(h)+'</div><div class="bD" style="width:'+d+'%">'+Math.round(d)+'</div><div class="bA" style="width:'+a+'%">'+Math.round(a)+"</div></div>";
}
function nextView(){
  if(!S.live.length)return '<div class="note">No live data yet.</div>';
  const up=S.live.filter(x=>x.status==="upcoming"),pl=S.live.filter(x=>x.status==="played").slice(-10).reverse();
  const t=S.lt;
  const cards=t?'<div class="cards">'+card(t.matches_played,"Played so far")+card(num(t.model_log_loss).toFixed(3),"Model log loss")+card(num(t.market_log_loss).toFixed(3),"Market log loss")+"</div>":"";
  const rows=up.map(m=>{
    const mk=m.market_home!=null?'<div class="d">Market: '+Math.round(num(m.market_home))+" / "+Math.round(num(m.market_draw))+" / "+Math.round(num(m.market_away))+"</div>":"";
    const xg=m.model_home_xg!=null?" · expected goals "+num(m.model_home_xg).toFixed(1)+"-"+num(m.model_away_xg).toFixed(1):"";
    return '<div class="card"><div class="d">'+esc(m.match_date)+" "+esc(m.kickoff_time||"")+"</div><div><b>"+esc(m.home_team)+"</b> v <b>"+esc(m.away_team)+"</b></div>"+lbar(num(m.model_home),num(m.model_draw),num(m.model_away))
     +'<div class="d" style="display:flex;justify-content:space-between"><span>Home</span><span>Draw</span><span>Away</span></div><div class="d" style="margin-top:4px">Model'+xg+"</div>"+mk+"</div>";
  }).join("");
  const rec=pl.map(m=>{
    const pk=num(m.model_home)>=num(m.model_draw)&&num(m.model_home)>=num(m.model_away)?"H":num(m.model_away)>=num(m.model_draw)?"A":"D";
    return '<div class="row"><span>'+esc(m.home_team)+" "+m.home_goals+"-"+m.away_goals+" "+esc(m.away_team)+'</span><span class="'+(pk===m.result?"ok":"no")+'" style="font-size:15px">'+(pk===m.result?"✓":"✗")+"</span></div>";
  }).join("");
  return '<div class="note">Live 2026/27. Probabilities for the next matches use only results already played. The model does not know about injuries, suspensions or transfers, and it is not betting advice.</div>'
   +cards
   +'<div class="sub">Season so far: model and market picks both right '+(t?num(t.model_accuracy_pct).toFixed(1)+"% and "+num(t.market_accuracy_pct).toFixed(1)+"%":"")+". Lower log loss is better.</div>"
   +"<h3>Upcoming</h3><div class=\"sub\">Bar and numbers are Home / Draw / Away %. Refreshed weekly from the latest results.</div>"+rows
   +'<h3>Latest results</h3><div class="card">'+rec+"</div>";
}
function render(){
  nav.innerHTML=TABS.map(t=>'<button data-k="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+"</button>").join("");
  view.innerHTML=S.tab==="table"?tableView():S.tab==="next"?nextView():S.tab==="preds"?predsView():S.tab==="team"?teamView():modelView();
}
function goTeam(name){S.team=name;S.tab="team";render();window.scrollTo(0,0)}

nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.k;render();window.scrollTo(0,0)}});
view.addEventListener("click",e=>{
  const a=e.target.closest("a[data-team]");
  if(a){e.preventDefault();goTeam(a.dataset.team);return}
  const tr=e.target.closest("tr[data-team]");
  if(tr){goTeam(tr.dataset.team);return}
  const o=e.target.closest("[data-open]");
  if(o){const id=Number(o.dataset.open);S.open=S.open===id?null:id;render();return}
  if(e.target.id==="more"){S.shown+=50;render()}
});
view.addEventListener("change",e=>{
  const id=e.target.id;
  if(id==="fteam"){S.team=e.target.value;S.shown=50;S.open=null}
  if(id==="fres"){S.res=e.target.value;S.shown=50;S.open=null}
  if(id==="fteam2"){S.team=e.target.value}
  if(id==="fmodel"){S.msel=e.target.value}
  render();
});

(async()=>{
  try{
