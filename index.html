<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FootIQ</title>
<style>
:root{--bg:#0e1512;--card:#17211c;--text:#e8f1ec;--muted:#8fa699;--accent:#2ecc71;--bad:#e74c3c;--line:#24332b}
@media (prefers-color-scheme:light){:root{--bg:#f4f8f5;--card:#fff;--text:#14201a;--muted:#5d7468;--accent:#1e9e55;--bad:#c0392b;--line:#dbe6df}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{padding:14px 16px 4px}
h1{margin:0;font-size:22px}h1 span{color:var(--accent)}
h3{margin:14px 0 2px}
.sub{color:var(--muted);font-size:12px;margin:6px 0}
nav{display:flex;gap:6px;padding:8px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:600 13px system-ui}
nav button.on{background:var(--accent);color:#06210f;border-color:var(--accent)}
main{padding:4px 12px 20px}
footer{padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}
.wrap{overflow-x:auto;padding:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 5px;text-align:center;white-space:nowrap}
th{color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.tn{text-align:left}
tr.top td:first-child{box-shadow:inset 3px 0 var(--accent)}
tr.bot td:first-child{box-shadow:inset 3px 0 var(--bad)}
tbody tr+tr td{border-top:1px solid var(--line)}
.f{display:inline-block;width:17px;height:17px;margin-left:2px;border-radius:50%;font:700 10px/17px system-ui;font-style:normal;color:#fff}
.f.W{background:#27ae60}.f.D{background:#7f8c8d}.f.L{background:#c0392b}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.c b{display:block;font-size:20px}.c span{color:var(--muted);font-size:11px}
select{width:100%;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit}
.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}
.m{display:flex;justify-content:space-between;gap:8px;align-items:center}
.d{color:var(--muted);font-size:11px}
.sc{font-weight:700}
.ok{color:var(--accent);font-weight:700;font-size:20px}.no{color:var(--bad);font-weight:700;font-size:20px}
button.more{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font:600 14px system-ui;margin-top:6px}
.note{border-left:3px solid var(--accent);padding:6px 10px;color:var(--muted);font-size:13px;margin:10px 0}
a{color:var(--accent)}
</style>
</head>
<body>
<header><h1>Foot<span>IQ</span> ⚽</h1><div class="sub">Premier League 2015/16</div></header>
<nav id="nav"></nav>
<main id="view"><p class="sub">Loading…</p></main>
<footer><p class="sub">Data: <a href="https://github.com/statsbomb/open-data">StatsBomb open data</a>, 2015/16 Premier League. Predictions are a historical backtest, not live forecasts.</p></footer>
<script>
const API="https://releufvadodqjufvqboi.supabase.co/rest/v1/";
const KEY="sb_publishable_kFt_dXaAGUm1ksFsNnAWTA_bqE0E8dL";
const S={tab:"table",table:[],preds:[],mq:[],team:"",res:"",pick:"",shown:50};
const TABS=[["table","Standings"],["preds","Predicted vs Actual"],["model","Model quality"]];
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const view=document.getElementById("view"),nav=document.getElementById("nav");
async function get(path){
  const r=await fetch(API+path,{headers:{apikey:KEY}});
  if(!r.ok)throw new Error("Request failed ("+r.status+")");
  return r.json();
}
function dots(f){return (f||"").split("").map(c=>'<i class="f '+esc(c)+'">'+esc(c)+"</i>").join("");}
function tableView(){
  const rows=S.table.map(t=>'<tr class="'+(t.position<=4?"top":t.position>=18?"bot":"")+'"><td>'+t.position+'</td><td class="tn">'+esc(t.team_name)+"</td><td>"+t.played+"</td><td>"+t.wins+"</td><td>"+t.draws+"</td><td>"+t.losses+"</td><td>"+(t.goal_difference>0?"+":"")+t.goal_difference+"</td><td><b>"+t.points+'</b></td><td>'+dots(t.last_5_form)+"</td></tr>").join("");
  return '<div class="card wrap"><table><thead><tr><th>#</th><th class="tn">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th><th>Last 5</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="sub">Green bar: top 4. Red bar: bottom 3. Calculated from the actual results of all 380 matches.</p>';
}
function pct(p){return Math.round(Number(p.predicted_outcome==="Home"?p.home_probability:p.predicted_outcome==="Draw"?p.draw_probability:p.away_probability));}
function opts(list,cur,all){return '<option value="">'+all+"</option>"+list.map(x=>'<option value="'+esc(x[0])+'"'+(x[0]===cur?" selected":"")+">"+esc(x[1])+"</option>").join("");}
function predsView(){
  const P=S.preds,n=P.length,ok=P.filter(p=>p.prediction_correct).length,cnt=k=>P.filter(p=>p.predicted_outcome===k).length;
  const teams=[...new Set(P.flatMap(p=>[p.home_team,p.away_team]))].sort();
  const f=P.filter(p=>(!S.team||p.home_team===S.team||p.away_team===S.team)&&(!S.res||(S.res==="ok")===!!p.prediction_correct)&&(!S.pick||p.predicted_outcome===S.pick));
  const rows=f.slice(0,S.shown).map(p=>'<div class="card m"><div><div class="d">'+esc(p.match_date)+"</div><div>"+esc(p.home_team)+' <span class="sc">'+p.home_score+"–"+p.away_score+"</span> "+esc(p.away_team)+'</div><div class="d">Predicted: '+esc(p.predicted_outcome)+" "+pct(p)+"% · Actual: "+esc(p.actual_outcome)+'</div></div><div class="'+(p.prediction_correct?"ok":"no")+'">'+(p.prediction_correct?"✓":"✗")+"</div></div>").join("");
  const card=(a,b)=>'<div class="c"><b>'+a+"</b><span>"+b+"</span></div>";
  return '<div class="note">Historical backtest: predictions for matches already played, made using only earlier results.</div>'+
  '<div class="cards">'+card(n,"Matches")+card(ok,"Correct")+card((n?ok/n*100:0).toFixed(1)+"%","Accuracy")+card(cnt("Home"),"Home picks")+card(cnt("Draw"),"Draw picks")+card(cnt("Away"),"Away picks")+"</div>"+
  '<div class="filters"><select id="fteam">'+opts(teams.map(t=>[t,t]),S.team,"All teams")+'</select><select id="fres">'+opts([["ok","Correct"],["bad","Wrong"]],S.res,"All results")+'</select><select id="fpick">'+opts([["Home","Home"],["Draw","Draw"],["Away","Away"]],S.pick,"All picks")+"</select></div>"+
  '<div class="sub">Showing '+Math.min(S.shown,f.length)+" of "+f.length+" matches</div>"+rows+(f.length>S.shown?'<button class="more" id="more">Show 50 more</button>':"");
}
function modelView(){
  const m=S.mq[0];
  if(!m)return '<div class="note">No model data yet.</div>';
  const P=S.preds,n=P.length||1,base=(P.filter(p=>p.actual_outcome==="Home").length/n*100).toFixed(1);
  const cal=S.mq.filter(r=>r.calibration_outcome).sort((a,b)=>a.calibration_outcome.localeCompare(b.calibration_outcome)||a.probability_bin_min_pct-b.probability_bin_min_pct);
  const rows=cal.map(r=>'<tr><td class="tn">'+esc(r.calibration_outcome)+"</td><td>"+r.probability_bin_min_pct+"–"+r.probability_bin_max_pct+"%</td><td>"+r.calibration_predictions+"</td><td>"+(Number(r.mean_predicted_probability)*100).toFixed(0)+"%</td><td>"+(Number(r.observed_frequency)*100).toFixed(0)+"%</td></tr>").join("");
  const card=(a,b)=>'<div class="c"><b>'+a+"</b><span>"+b+"</span></div>";
  return '<div class="note"><b>'+esc(m.evaluation_label)+".</b> These predictions were made for matches already played, using only earlier results. This is not a live forecast and does not show how the model will perform in the future.</div>"+
  '<div class="cards">'+card(Number(m.accuracy_pct).toFixed(1)+"%","Accuracy")+card(Number(m.brier_score).toFixed(3),"Brier score")+card(Number(m.log_loss).toFixed(3),"Log loss")+"</div>"+
  '<div class="card">Always picking a home win would be right '+base+"% of the time. Brier score and log loss measure the quality of the probabilities (lower is better). The model never picks a draw as its top outcome, although it gives every match a draw probability.</div>"+
  "<h3>Calibration</h3><div class=\"sub\">When the model said X%, how often did it happen?</div>"+
  '<div class="card wrap"><table><thead><tr><th class="tn">Outcome</th><th>Said</th><th>Matches</th><th>Avg said</th><th>Actual</th></tr></thead><tbody>'+rows+"</tbody></table></div>";
}
function render(){
  nav.innerHTML=TABS.map(t=>'<button data-k="'+t[0]+'" class="'+(S.tab===t[0]?"on":"")+'">'+t[1]+"</button>").join("");
  view.innerHTML=S.tab==="table"?tableView():S.tab==="preds"?predsView():modelView();
}
nav.addEventListener("click",e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.k;render();window.scrollTo(0,0);}});
view.addEventListener("change",e=>{const id=e.target.id;if(id==="fteam")S.team=e.target.value;if(id==="fres")S.res=e.target.value;if(id==="fpick")S.pick=e.target.value;S.shown=50;render();});
view.addEventListener("click",e=>{if(e.target.id==="more"){S.shown+=50;render();}});
(async()=>{
  try{
    const r=await Promise.all([get("league_table?select=*&order=position.asc"),get("prediction_dashboard?select=*&order=match_date.asc,match_id.asc&limit=1000"),get("model_quality?select=*")]);
    S.table=r[0];S.preds=r[1];S.mq=r[2];render();
  }catch(err){view.innerHTML='<div class="note">Could not load data: '+esc(err.message)+"</div>";}
})();
</script>
</body>
</html>
